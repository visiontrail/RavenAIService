version: '3.8'

services:
  app:
    build: .
    expose:
      - "8085"
    volumes:
      - app_logs:/app/logs
      - app_temp:/app/temp
      - app_data:/app/data
      - app_db:/app
    depends_on:
      - redis
    env_file:
      - .env.example
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: "redis:7-alpine"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  worker:
    build: .
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2 --queues=log_processing,default --hostname=worker@%h
    volumes:
      - app_logs:/app/logs
      - app_temp:/app/temp
      - app_data:/app/data
      - app_db:/app
    depends_on:
      - redis
    env_file:
      - .env.example
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    ports:
      - "8085:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

volumes:
  redis_data:
  app_logs:
  app_temp:
  app_data:
  app_db: