version: '3.8'

services:
  # Redis服务
  redis:
    image: redis:7-alpine
    container_name: logstagingservice_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    command: redis-server --appendonly yes
    networks:
      - app_network_dev

  # PostgreSQL数据库服务
  postgres:
    image: postgres:15-alpine
    container_name: logstagingservice_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-logstagingservice_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - app_network_dev

  # 主应用服务（开发模式）
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: logstagingservice_app_dev
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - HOST=0.0.0.0
      - PORT=8085
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-logstagingservice_dev}
      - LOG_LEVEL=DEBUG
    ports:
      - "8085:8085"
    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./temp:/app/temp
      - ./uploads:/app/uploads
    depends_on:
      - redis
      - postgres
    command: uvicorn app.main:app --host 0.0.0.0 --port 8085 --reload
    networks:
      - app_network_dev

  # Celery Worker服务（开发模式）
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: logstagingservice_celery_worker_dev
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=debug --concurrency=2
    environment:
      - ENVIRONMENT=development
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-logstagingservice_dev}
    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./temp:/app/temp
      - ./uploads:/app/uploads
    depends_on:
      - redis
      - postgres
    networks:
      - app_network_dev

# 数据卷配置
volumes:
  redis_data_dev:
    driver: local
  postgres_data_dev:
    driver: local

# 网络配置
networks:
  app_network_dev:
    driver: bridge