# Docker Compose 覆盖文件
# 用于本地开发环境的特殊配置
# 此文件会自动与 docker-compose.yml 合并

version: '3.8'

services:
  # 应用服务开发配置
  app:
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - DEBUG=true
      - RELOAD=true
    volumes:
      # 挂载源代码以支持热重载
      - .:/app
    ports:
      # 暴露调试端口
      - "5678:5678"  # Python调试端口

  # Celery Worker开发配置
  celery_worker:
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    volumes:
      - .:/app
    command: celery -A app.celery_app worker --loglevel=debug --concurrency=2 --reload

  # 开发工具服务
  adminer:
    image: adminer
    container_name: logstagingservice_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - app_network

  # Redis Commander（Redis管理界面）
  redis_commander:
    image: rediscommander/redis-commander:latest
    container_name: logstagingservice_redis_commander
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    networks:
      - app_network