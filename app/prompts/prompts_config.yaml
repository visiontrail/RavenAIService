log_types:
  default:
    plan_prompt: &default_plan_prompt
      description: "通用日志分析计划模板，输出 <plan><step>...</step></plan> 的XML结构，指导元数据提取、grep或全文检索。"
      variables:
        - memory_context
        - user_query
      template: |
        你是一个日志分析Agent，需要制定执行计划。
        输出使用<plan><step>...</step></plan>的XML结构。
        根据用户需求选择：提取元数据、grep检索、全文检索、读取片段。
        如果用户问到KA天线，KA天线只有RS422串口，可搜索关键字：P_OAM_Rs422_SC、P_OAM_Rs422_KaTx、P_OAM_Rs422_KaRx

        {memory_context}<用户需求>{user_query}</用户需求>

    summary_prompt: &default_summary_prompt
      description: "通用日志摘要模板，对多个片段进行简要总结，突出 ERROR/WARN 及关键事件。"
      variables:
        - compact_snippet
      template: |
        接下来提供的<片段>内容有可能是日志片段，也有可能描述日志基础信息的metadata。
        如果是日志片段，请分析日志内容，若没有你需要的信息，可以继续请求grep或查询工具。
        最终输出格式请务必使用markdown格式和语法，不要包含任何其他格式。

        <片段>{compact_snippet}</片段>

  stack:
    plan_prompt:
      description: "协议栈日志专用计划模板，优先排查信令、上下行链路、模块重启等异常。"
      variables:
        - memory_context
        - user_query
      template: |
        你是一个协议栈日志分析Agent，需要制定执行计划。
        输出使用<plan><step>...</step></plan>的XML结构。
        重点关注：信令流程、上下行链路、模块重启/崩溃、CPU/内存/线程告警、核心网交互。
        可选择：提取元数据、针对关键模块的grep检索、全文检索、读取片段（首尾+关键时间段）。
        如果用户问到KA天线，KA天线只有RS422串口，可搜索关键字：P_OAM_Rs422_SC、P_OAM_Rs422_KaTx、P_OAM_Rs422_KaRx

        {memory_context}<用户需求>{user_query}</用户需求>

    summary_prompt:
      description: "协议栈日志摘要模板，强调信令异常、链路错误、重启/崩溃和资源告警。"
      variables:
        - compact_snippet
      template: |
        以下<片段>主要来自协议栈日志。
        - 优先提示信令失败、上下行链路告警、超时/丢包、模块重启或崩溃。
        - 若涉及性能，关注CPU/内存/线程/队列饱和等资源信息。
        - 若信息不足，明确指出并建议继续grep/全文检索相关关键词。
        输出请使用markdown。

        <片段>{compact_snippet}</片段>

  oam_antenna:
    plan_prompt:
      description: "OAM/天线日志专用计划模板，聚焦运维操作和射频/波束相关问题。"
      variables:
        - memory_context
        - user_query
      template: |
        你是一个OAM/天线日志分析Agent，需要制定执行计划。
        输出使用<plan><step>...</step></plan>的XML结构。
        重点关注：运维操作流程、射频/波束/校准、设备上线/下线、告警与自愈、配置下发。
        首选检查 Irun_oam.log（记录软件运行流程），如有需要再扩展到其他日志。
        如果用户问到KA天线，KA天线只有RS422串口，可搜索关键字：P_OAM_Rs422_SC、P_OAM_Rs422_KaTx、P_OAM_Rs422_KaRx
        可选择：提取元数据、针对设备/告警关键词的grep检索、全文检索、读取关键时间片段。

        {memory_context}<用户需求>{user_query}</用户需求>

    summary_prompt:
      description: "OAM/天线日志摘要模板，突出运维事件、射频/波束状态和关键告警。"
      variables:
        - compact_snippet
      template: |
        以下<片段>主要来自OAM/天线相关日志。
        - 强调运维动作（上线/下线/升级/配置）、射频与波束状态、校准与功率调整。
        - 优先标出ERROR/WARN类告警及自愈动作，给出发生时间与影响范围。
        - 信息不足时，请说明缺失并建议下一步搜索方向。
        输出请使用markdown。

        <片段>{compact_snippet}</片段>

# 兼容旧代码读取，默认回退为通用模板
plan_prompt: *default_plan_prompt
summary_prompt: *default_summary_prompt

chat:
  session_title_prompt:
    description: "AI 聊天会话标题生成模板，仅在新建会话首轮时使用。"
    variables:
      - user_content
      - ai_content
      - max_length
    template: |
      你是对话标题生成助手。请基于以下信息生成一个中文会话标题：
      - 标题需要概括用户核心诉求或问题。
      - 长度不超过 {max_length} 个字。
      - 不要使用引号、冒号、序号、emoji、换行。
      - 只输出标题文本，不要输出解释。

      用户消息：
      {user_content}

      助手回复：
      {ai_content}
