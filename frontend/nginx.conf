map "$request_method:$http_accept:$uri" $admin_spa_route {
    default 0;
    ~^GET:.*text/html.*:/admin/?$ 1;
    ~^GET:.*text/html.*:/admin/(prompts|users|releases|project-repos|agent-skills|model-settings|metrics)/?$ 1;
    ~^HEAD:.*text/html.*:/admin/?$ 1;
    ~^HEAD:.*text/html.*:/admin/(prompts|users|releases|project-repos|agent-skills|model-settings|metrics)/?$ 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 内置 DNS，TTL 10s 使 nginx 动态刷新 backend IP
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8085;

    client_max_body_size 1G;
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;

    location = /health {
        proxy_pass $backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location /raven/api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location /admin/ {
        error_page 418 = @spa_index;
        if ($admin_spa_route) {
            return 418;
        }

        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # 每个 /admin/<page> 既是 SPA 路由又是同名 API 路径，靠上面的 $admin_spa_route
    # （Accept 头）区分：text/html 给应用外壳，application/json 反代后端。
    #
    # 因此这个 HTML 响应绝不能被缓存：它带 ETag/Last-Modified 却没有 Vary，浏览器
    # 会把它按 URL 存下来，随后页面自己发往同一 URL 的 XHR 直接命中缓存拿到 HTML，
    # 根本不会到达 nginx —— axios 于是把应用外壳当成 API 响应解析，页面报
    # 「无法加载模型设置」。Vary: Accept 声明该 URL 的响应随 Accept 变化，
    # no-store 兜住忽略 Vary 的缓存（SPA 外壳本就不该缓存，否则发版后仍加载旧
    # index.html 指向已删除的 hash 资源）。
    location @spa_index {
        add_header Cache-Control "no-store" always;
        add_header Vary "Accept" always;
        try_files /index.html =404;
    }

    location /docs {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /redoc {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass $backend/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/device-link {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
