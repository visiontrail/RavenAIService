name: model-sentinel

services:
  sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: model-sentinel
    restart: unless-stopped
    init: true
    ports:
      - "${MODEL_SENTINEL_BIND_IP:-127.0.0.1}:${MODEL_SENTINEL_PORT:-8765}:8765"
    environment:
      MODEL_SENTINEL_DATA_DIR: /data
      MODEL_SENTINEL_TIMEZONE: "${MODEL_SENTINEL_TIMEZONE:-Asia/Singapore}"
      TARGET_NAME: "${TARGET_NAME:-银河私有模型集群}"
      TARGET_PROTOCOL: "${TARGET_PROTOCOL:-anthropic}"
      TARGET_BASE_URL: "${TARGET_BASE_URL:-http://oneapi.yhroot.com}"
      TARGET_MODEL: "${TARGET_MODEL:-yinhe-thinking}"
      TARGET_INTERVAL_SECONDS: "${TARGET_INTERVAL_SECONDS:-300}"
      TARGET_TIMEOUT_SECONDS: "${TARGET_TIMEOUT_SECONDS:-1800}"
      TARGET_MAX_TOKENS: "${TARGET_MAX_TOKENS:-1024}"
    volumes:
      - sentinel-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3)",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  sentinel-data:
    name: model-sentinel-data
