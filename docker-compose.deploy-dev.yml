version: '3.8'

services:
  app:
    build: .
    expose:
      - "8085"
      - "8083"
    ports:
      - "8083:8083"
    volumes:
      - app_logs:/app/logs
      - app_temp:/app/temp
      - app_data:/app/data
      # 添加源代码热重载挂载
      - ./app:/app/app:ro  # 只读挂载，防止容器内意外修改
      - ./requirements.txt:/app/requirements.txt:ro
      - ./alembic:/app/alembic:ro
      - ./alembic.ini:/app/alembic.ini:ro
      # 添加前端代码热重载挂载
      - ./frontend:/app/frontend:ro  # 挂载前端源码
      - ./frontend/dist:/app/frontend/dist  # 挂载构建输出目录
      - ./.env:/app/.env:ro  # 挂载环境变量文件供应用读取
      - ./package-server/.env:/app/package-server/.env:ro  # 挂载包服环境变量供 Node 端读取
      - ./package-server/src:/app/package-server/src:ro  # 挂载 package-server 源码以支持热重载
    depends_on:
      - redis
    env_file:
      - .env.example
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: "redis:7-alpine"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build: .
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2 --queues=log_processing,ai_analysis,maintenance,default --hostname=worker@%h
    volumes:
      - app_logs:/app/logs
      - app_temp:/app/temp
      - app_data:/app/data
      # 添加源代码热重载挂载
      - ./app:/app/app:ro
      - ./requirements.txt:/app/requirements.txt:ro
      - ./alembic:/app/alembic:ro
      - ./alembic.ini:/app/alembic.ini:ro
      - ./.env:/app/.env:ro  # 挂载环境变量文件供应用读取
    depends_on:
      - redis
    env_file:
      - .env.example
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  beat:
    build: .
    command: celery -A app.celery_app beat --loglevel=info --pidfile=/tmp/celery_beat.pid --schedule=/tmp/celerybeat-schedule
    volumes:
      - app_logs:/app/logs
      - app_temp:/app/temp
      - app_data:/app/data
      - ./app:/app/app:ro
      - ./requirements.txt:/app/requirements.txt:ro
      - ./alembic:/app/alembic:ro
      - ./alembic.ini:/app/alembic.ini:ro
      - ./.env:/app/.env:ro
    depends_on:
      - redis
    env_file:
      - .env.example
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    ports:
      - "8085:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
  app_logs:
  app_temp:
  app_data:
